<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header">
        <nav id="navbar">
            <h1>TodoApp</h1>
        </nav>
    </header>
    <main id="body">
        <section id="todo-input">
            <label>Title</label>
            <input type="text" name="title" id="title">
            <label>Description</label>
            <textarea name="desc" id="desc"></textarea>
            <button id="create-todo">Add</button>
        </section>
        <section id="todos">
            <h1>Todos</h1>
            <button id="clear-todos">Clear</button>
        </section>
        <section id="completed">
            <h1>Completed</h1>
            <button id="clear-complete-todos">Clear</button>
        </section>
    </main>
    <footer>

    </footer>
    <script src="script.js"></script>
</body>
</html>
