<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Create account | TodoApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="../../auth/auth.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
            <span class="brand">TodoApp</span>
        </nav>
    </header>

    <main class="register-page">
        <section class="register-card" aria-labelledby="register-title">
            <div class="welcome">
                <h1 id="register-title">Create your account</h1>
                <p class="intro">Sign up and get your day organized.</p>
            </div>

            <form id="register-form" class="register-form" action="#" method="post">
                <div class="field">
                    <label for="name">Name</label>
                    <input
                        id="name"
                        name="name"
                        type="text"
                        placeholder="Your name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="254"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-input-wrap">
                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="At least 6 characters"
                            autocomplete="new-password"
                            maxlength="4096"
                            minlength="6"
                            required
                        >
                        <button
                            class="password-toggle"
                            type="button"
                            aria-controls="password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg class="password-icon password-icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="password-icon password-icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="m3 3 18 18"></path>
                                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.9"></path>
                                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirm-password">Confirm password</label>
                    <div class="password-input-wrap">
                        <input
                            id="confirm-password"
                            name="confirm-password"
                            type="password"
                            placeholder="Enter your password again"
                            autocomplete="new-password"
                            maxlength="4096"
                            minlength="6"
                            required
                        >
                        <button
                            class="password-toggle"
                            type="button"
                            aria-controls="confirm-password"
                            aria-label="Show confirm password"
                            aria-pressed="false"
                        >
                            <svg class="password-icon password-icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="password-icon password-icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="m3 3 18 18"></path>
                                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.9"></path>
                                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="register-button" type="submit" aria-busy="false">
                    <span class="button-label">Create account</span>
                    <span class="button-spinner" aria-hidden="true"></span>
                </button>
                <p class="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
            </form>

            <p class="account-prompt">
                Already have an account?
                <a class="text-link" href="../login/index.html">Log in</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>Developed by: Tayyab Ahmed</p>
    </footer>
    <!-- Vite bundles the Firebase-backed registration form as an ES module. -->
    <script type="module" src="./script.js"></script>
</body>
</html>
