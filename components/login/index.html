<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Log in | TodoApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="../../auth/auth.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
            <span class="brand">TodoApp</span>
        </nav>
    </header>

    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <div class="welcome">
                <h1 id="login-title">Welcome Back</h1>
                <p class="intro">Log in to manage your todos.</p>
            </div>

            <form id="login-form" class="login-form" action="#" method="post">
                <div class="field">
                    <label for="email">Email address</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="254"
                        required
                    >
                </div>

                <div class="field">
                    <div class="password-label">
                        <label for="password">Password</label>
                        <a id="forgot-password-link" href="#" class="text-link">Forgot password?</a>
                    </div>
                    <div class="password-input-wrap">
                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            maxlength="4096"
                            required
                        >
                        <button
                            class="password-toggle"
                            type="button"
                            aria-controls="password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg class="password-icon password-icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="password-icon password-icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="m3 3 18 18"></path>
                                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.9"></path>
                                <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="login-button" type="submit" aria-busy="false">
                    <span class="button-label">Log in</span>
                    <span class="button-spinner" aria-hidden="true"></span>
                </button>
                <p class="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
            </form>

            <div class="login-divider" aria-hidden="true"><span>or</span></div>
            <button id="google-login-button" class="google-login-button" type="button" aria-busy="false">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.94 46.98 31.84 46.98 24.55z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.14 1.45-4.89 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                </svg>
                <span class="google-button-label">Continue with Google</span>
            </button>

            <p class="signup-prompt">
                Don’t have an account?
                <a class="text-link" href="../register/index.html">Create one</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>Developed by: Tayyab Ahmed</p>
    </footer>
    <!-- Vite bundles the Firebase-backed login form as an ES module. -->
    <script type="module" src="./script.js"></script>
</body>
</html>
